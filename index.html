<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>start — твоя стартовая</title>
  <style>
    :root {
      --bg:#0b0d10; --panel:#111419; --panel-hover:#171a20; --text:#f2f4f7;
      --muted:#858d99; --dim:#555d68; --line:#20252d; --accent:#8ab4ff;
      --shadow:0 18px 50px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; min-height:100vh; color:var(--text); background:
      radial-gradient(circle at 50% -10%,rgba(138,180,255,.08),transparent 32rem),var(--bg);
      font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input{font:inherit}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:46px 0 55px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:12px}
    .mark{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--accent);background:var(--panel)}
    h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.02em}
    .date{color:var(--muted);font-size:12px;margin-top:2px}
    .theme{
      border:1px solid var(--line);background:var(--panel);color:var(--muted);width:36px;height:36px;
      border-radius:10px;cursor:pointer;transition:.2s
    }
    .theme:hover{color:var(--text);background:var(--panel-hover)}
    .search{
      display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
      border-radius:14px;padding:0 15px;box-shadow:var(--shadow);margin-bottom:30px
    }
    .search span{color:var(--dim);font-size:17px}
    #search{width:100%;height:52px;background:none;border:0;outline:0;color:var(--text)}
    #search::placeholder{color:#626a75}
    kbd{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
    .section{margin-top:26px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);font-weight:700}
    .section-count{font-size:11px;color:var(--dim)}
    .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
    .card{
      min-height:72px;display:flex;align-items:center;gap:11px;padding:13px 12px;
      border:1px solid var(--line);border-radius:12px;background:rgba(17,20,25,.72);
      transition:background .16s,border-color .16s,transform .16s;position:relative
    }
    .card:hover{background:var(--panel-hover);border-color:#303640;transform:translateY(-1px)}
    .icon{
      width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:#191d24;color:#aab2bf;
      display:grid;place-items:center;font-size:13px;font-weight:700
    }
    .name{font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .shortcut{position:absolute;right:8px;top:7px;font-size:9px;color:var(--dim)}
    .hidden{display:none!important}
    footer{display:flex;justify-content:space-between;gap:15px;margin-top:34px;color:var(--dim);font-size:11px}
    footer a:hover{color:var(--muted)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:620px){
      .wrap{width:min(100% - 20px,520px);padding-top:25px}
      header{align-items:center}.date{display:none}
      .grid{grid-template-columns:repeat(2,1fr)}
      .card{min-height:68px}
      .shortcut{display:none}
    }
    @media(prefers-color-scheme:light){
      body.light{--bg:#f5f6f8;--panel:#fff;--panel-hover:#f0f2f5;--text:#15181d;--muted:#68707c;--dim:#9299a4;--line:#e1e4e8;--accent:#376ee6;--shadow:0 15px 40px rgba(20,30,50,.08)}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><div class="mark">↗</div><div><h1>start</h1><div class="date" id="date"></div></div></div>
    </div>
    <button class="theme" id="theme" title="Переключить тему" aria-label="Переключить тему">◐</button>
  </header>

  <form class="search" id="searchForm">
    <span>⌕</span>
    <input id="search" autocomplete="off" autofocus placeholder="Поиск по сайтам или в Google…">
    <kbd>Ctrl K</kbd>
  </form>

  <main id="content"></main>

  <footer>
    <span>Enter — открыть первый результат · Esc — очистить</span>
    <a href="https://github.com/neko152/my-start-page" target="_blank" rel="noopener">GitHub ↗</a>
  </footer>
</div>

<script>
const groups = [
  {title:"Основное",items:[
    ["Google","Поиск","https://www.google.com","G"],
    ["YouTube","Видео","https://www.youtube.com","YT"],
    ["Wikipedia","Энциклопедия","https://www.wikipedia.org","W"],
    ["Reddit","Сообщества","https://www.reddit.com","R"],
    ["Telegram","Мессенджер","https://web.telegram.org","TG"],
    ["VK","Соцсеть","https://vk.com","VK"],
    ["Pinterest","Идеи","https://www.pinterest.com","P"],
    ["Twitch","Стримы","https://www.twitch.tv","TW"]
  ]},
  {title:"Разработка",items:[
    ["GitHub","Код и репозитории","https://github.com","GH"],
    ["Stack Overflow","Вопросы и ответы","https://stackoverflow.com","SO"],
    ["MDN","Web-документация","https://developer.mozilla.org","MD"],
    ["Python","Документация","https://docs.python.org/3/","PY"],
    ["npm","JavaScript-пакеты","https://www.npmjs.com","N"],
    ["Vercel","Деплой","https://vercel.com","V"],
    ["CodePen","Frontend-песочница","https://codepen.io","CP"],
    ["Replit","Онлайн IDE","https://replit.com","RP"]
  ]},
  {title:"AI",items:[
    ["ChatGPT","AI-помощник","https://chatgpt.com","AI"],
    ["Claude","AI-помощник","https://claude.ai","C"],
    ["Gemini","AI от Google","https://gemini.google.com","G"],
    ["Perplexity","AI-поиск","https://www.perplexity.ai","P"],
    ["Microsoft Copilot","AI-помощник","https://copilot.microsoft.com","M"],
    ["Hugging Face","AI-модели","https://huggingface.co","HF"],
    ["Canva AI","Дизайн и AI","https://www.canva.com","CA"],
    ["NotebookLM","Работа с источниками","https://notebooklm.google.com","NL"]
  ]},
  {title:"Дизайн и файлы",items:[
    ["Figma","Интерфейсы","https://www.figma.com","FG"],
    ["Canva","Графика","https://www.canva.com","CV"],
    ["Photopea","Редактор фото","https://www.photopea.com","PP"],
    ["Unsplash","Фотографии","https://unsplash.com","U"],
    ["Pexels","Фото и видео","https://www.pexels.com","PX"],
    ["Remove.bg","Удалить фон","https://www.remove.bg","RB"],
    ["TinyPNG","Сжатие изображений","https://tinypng.com","TP"],
    ["Google Drive","Облако","https://drive.google.com","GD"]
  ]},
  {title:"Игры",items:[
    ["Steam","Игры","https://store.steampowered.com","S"],
    ["Epic Games","Игры","https://store.epicgames.com","EG"],
    ["GOG","Игры без DRM","https://www.gog.com","GOG"],
    ["Nintendo","Nintendo","https://www.nintendo.com","N"],
    ["PlayStation","PlayStation","https://www.playstation.com","PS"],
    ["Xbox","Xbox","https://www.xbox.com","X"],
    ["PCGamingWiki","PC-гайды","https://www.pcgamingwiki.com","PC"],
    ["Speedrun.com","Спидраны","https://www.speedrun.com","SR"]
  ]},
  {title:"Полезное",items:[
    ["Google Translate","Переводчик","https://translate.google.com","TR"],
    ["DeepL","Переводчик","https://www.deepl.com","DL"],
    ["Google Maps","Карты","https://maps.google.com","MP"],
    ["Speedtest","Скорость интернета","https://www.speedtest.net","ST"],
    ["VirusTotal","Проверка файлов/URL","https://www.virustotal.com","VT"],
    ["Internet Archive","Архив интернета","https://archive.org","IA"],
    ["12ft","Чтение страниц","https://12ft.io","12"],
    ["Temp Mail","Временная почта","https://temp-mail.org","TM"]
  ]}
];

const content=document.getElementById("content");
const search=document.getElementById("search");
const date=document.getElementById("date");

function render(){
  content.innerHTML=groups.map((group,gi)=>`
    <section class="section" data-group="${gi}">
      <div class="section-head"><span class="section-title">${group.title}</span><span class="section-count">${group.items.length}</span></div>
      <div class="grid">${group.items.map((item,i)=>`
        <a class="card" href="${item[2]}" target="_self" data-search="${(item[0]+" "+item[1]).toLowerCase()}">
          <span class="icon">${item[3]}</span>
          <span><div class="name">${item[0]}</div><div class="desc">${item[1]}</div></span>
          ${i<9?'<span class="shortcut">'+(i+1)+'</span>':''}
        </a>`).join("")}</div>
    </section>`).join("");
}
render();

function updateDate(){
  date.textContent=new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
}
updateDate();

search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(card=>card.classList.toggle("hidden",q&&!card.dataset.search.includes(q)));
  document.querySelectorAll(".section").forEach(section=>{
    const visible=section.querySelectorAll(".card:not(.hidden)").length;
    section.classList.toggle("hidden",visible===0);
    section.querySelector(".section-count").textContent=visible;
  });
});

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  const first=document.querySelector(".card:not(.hidden)");
  if(first && search.value.trim()) first.click();
  else if(search.value.trim()) location.href="https://www.google.com/search?q="+encodeURIComponent(search.value);
});

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();search.focus();search.select()}
  if(e.key==="Escape"){search.value="";search.dispatchEvent(new Event("input"));search.focus()}
});

document.addEventListener("keydown",e=>{
  if(document.activeElement===search || e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^[1-9]$/.test(e.key)){
    const n=Number(e.key), cards=[...document.querySelectorAll(".card:not(.hidden)")];
    if(cards[n-1]) cards[n-1].click();
  }
});

const theme=document.getElementById("theme");
if(localStorage.getItem("start-theme")==="light")document.body.classList.add("light");
theme.onclick=()=>{
  document.body.classList.toggle("light");
  localStorage.setItem("start-theme",document.body.classList.contains("light")?"light":"dark");
};
</script>
</body>
</html>
